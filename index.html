<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speech Partner.Spanish</title>
<meta name="description" content="Speech Partner.Spanish: zinnen, vertaling en oefening voor beginners.">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpeechPartner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <button id="logo" class="logo" type="button" aria-label="Taal" aria-haspopup="true" aria-expanded="false"></button>
    <div id="langMenu" class="langmenu" hidden></div>
    <h1 data-i18n="Speech Partner.Spanish">Speech Partner.Spanish</h1>
    <button id="setBtn" class="iconbtn" type="button" aria-label="Instellingen" data-i18n-aria="Instellingen">⚙</button>
  </div>
  <div class="transbar">
    <input id="vtxt" type="text" autocomplete="off" autocapitalize="sentences" data-ph="Vertaal Nederlands naar Spaans" aria-label="Vertaal">
    <button id="vbtn" class="btn primary" type="button" data-i18n="Vertaal">Vertaal</button>
    <button id="mbtn" class="btn mic" type="button" aria-label="Spreek een Spaanse reactie in">🎤</button>
  </div>
  <div id="transOut" class="transout" hidden></div>
  <div id="settings" class="settings" aria-hidden="true">
    <div class="setrow">
      <label><span data-i18n="Taal">Taal</span>
        <select id="langSel">
          <option value="nl">Nederlands</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <label><span data-i18n="Thema">Thema</span>
        <select id="themeSel">
          <option value="standaard" data-i18n="Standaard">Standaard</option>
          <option value="cafe" data-i18n="Café">Café</option>
        </select>
      </label>
    </div>
    <div class="setrow">
      <label class="grow"><span data-i18n="Snelheid van voorlezen">Snelheid van voorlezen</span>
        <span class="speedwrap"><input id="rate" type="range" min="0.5" max="1.2" step="0.1" value="0.9"><b id="rateVal">0.9</b>x</span>
      </label>
    </div>
    <div class="setrow">
      <button id="resetUnd" class="btn" type="button" data-i18n="Begrepen items resetten">Begrepen items resetten</button>
      <button id="resetProg" class="btn" type="button" data-i18n="Voortgang resetten">Voortgang resetten</button>
      <p class="note" data-i18n="Woordenlijst: Wiktionary, CC BY-SA 4.0, via kaikki.org">Woordenlijst: Wiktionary, CC BY-SA 4.0, via kaikki.org</p>
    </div>
  </div>
</header>

<main id="view"></main>

<nav id="nav" class="bottomnav" aria-label="Hoofdmenu"></nav>

<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/dict-wiki.js"></script>
<script src="js/dict-extra.js"></script>
<script src="js/basis.js"></script>
<script src="js/grammatica.js"></script>
<script src="js/dict.js"></script>
<script src="js/uitspraak.js"></script>
<script src="js/app.js"></script>
</body>
</html>
